name: Ingest PDF

on:
  repository_dispatch:
    types: [ingest_pdf]

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          EMBED_SERVICE_URL: ${{ secrets.EMBED_SERVICE_URL }}
          RERANK_SERVICE_URL: ${{ secrets.RERANK_SERVICE_URL }}
          MODEL_SERVICE_SECRET: ${{ secrets.MODEL_SERVICE_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # GROQ_MODEL/GROQ_VISION_MODEL/GRAPH_MODEL/ANSWER_MODEL/GEMINI_MODEL
          # deliberately omitted: no GH Actions repo variables were ever
          # created for these, so `${{ vars.X }}` resolved to an empty string
          # (not absent) and silently overrode app.py's sensible in-code
          # defaults with "" — surfaced as Groq vision 404s with model=``.
          # Falling through to the code defaults instead.
          # Never interpolate client_payload into `run:` directly — it is
          # attacker-controllable and would be shell-injected.
          STORAGE_PATH: ${{ github.event.client_payload.storage_path }}
          USER_ID: ${{ github.event.client_payload.user_id }}
          FILENAME: ${{ github.event.client_payload.filename }}
          DISPLAY_NAME: ${{ github.event.client_payload.display_name }}
        run: python scripts/ingest_worker.py "$STORAGE_PATH" "$USER_ID" "$FILENAME" "$DISPLAY_NAME"
